<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Class Attendance</title>
    <!-- <link rel="stylesheet" href="style.css"> -->

    <style>
      /* Google Font */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
        }

        .login-container{
            width:100%;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .login-box{
            background:#fff;
            padding:40px;
            width:380px;
            border-radius:15px;
            box-shadow:0 15px 35px rgba(0,0,0,0.2);
            text-align:center;
        }

        .login-box h2{
            font-size:30px;
            margin-bottom:10px;
            color:#333;
        }

        .login-box p{
            color:#777;
            margin-bottom:30px;
        }

        .input-group{
            text-align:left;
            margin-bottom:20px;
        }

        .input-group label{
            display:block;
            margin-bottom:8px;
            color:#444;
            font-size:14px;
            font-weight:500;
        }

        .input-group input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            outline:none;
            transition:.3s;
            font-size:15px;
        }

        .input-group input:focus{
            border-color:#4facfe;
            box-shadow:0 0 5px rgba(79,172,254,.5);
        }

        .options{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:25px;
            font-size:14px;
        }

        .options a{
            color:#4facfe;
            text-decoration:none;
        }

        .options a:hover{
            text-decoration:underline;
        }

        button{
            width:100%;
            padding:13px;
            background:#4facfe;
            color:#fff;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
            font-weight:600;
            transition:.3s;
        }

        button:hover{
            background:#2196f3;
        }

        .signup-link{
            margin-top:20px;
            font-size:14px;
            color:#555;
        }

        .signup-link a{
            color:#4facfe;
            text-decoration:none;
            font-weight:600;
        }

        .signup-link a:hover{
            text-decoration:underline;
        }

        @media(max-width:450px){
            .login-box{
                width:100%;
                padding:30px;
            }
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-box">
        <h2>Welcome Back</h2>
        <p>Sign in to your account</p>

        <form action="#">
            <div class="input-group">
                <label>Student ID</label>
                <input type="text" id="studentID" placeholder="Student ID">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Password">
            </div>

            <div class="options">
                <label>
                    <input type="checkbox"> Remember me
                </label>
                <a href="#">Forgot Password?</a>
            </div>

            <button onclick="login()">Login</button>

            <div class="signup-link">
                Don't have an account?
                <a href="#">Sign Up</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
